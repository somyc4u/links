<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע 777 PRO - הזאב הבודד</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    <style>
        :root {
            --primary: #bb86fc; /* סגול ניאון */
            --secondary: #6a1b9a; /* סגול מלכותי */
            --bg: #050505;
            --card-bg: #121212;
            --text: #ffffff;
            --accent: #00e5ff;
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 10px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        /* כפתור ניווט עליון */
        .nav-header {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }
        .btn-nav {
            background: #222;
            color: #ddd;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #444;
            font-weight: bold;
        }

        .main-logo {
            width: 100%; 
            max-width: 450px; 
            display: block; 
            margin: 0 auto 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(106, 27, 154, 0.5);
        }

        #dashboard {
            background: #0f0f0f;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--secondary);
            font-size: 16px;
            color: #eee;
            line-height: 1.6;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        #dashboard b { color: var(--primary); }
        .hot-nums { color: #ff5252; font-weight: bold; }
        
        .controls-wrapper {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none; 
            flex-direction: column;
            gap: 15px;
            border: 1px solid #333;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .btn-refresh {
            background: linear-gradient(45deg, var(--secondary), #4a0072);
            color: #fff;
            border: 2px solid #ffffff;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 15px rgba(106, 27, 154, 0.6);
        }
        
        .select-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }
        select {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
        }

        .house-wrapper {
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .house-title {
            font-weight: bold;
            font-size: 15px;
            padding: 10px 15px;
            background: rgba(106, 27, 154, 0.4);
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .house-box {
            padding: 15px 5px; 
            display: flex;
            justify-content: center; 
            align-items: center;
            gap: 5px; 
            background-color: var(--card-bg); 
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        
        .num-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
            border: 2px solid #ffffff;
            flex-shrink: 0; 
        }

        .circle-human { background-color: #6a1b9a; }
        .circle-machine { background-color: #d32f2f; }
        
        #loading-msg {
            text-align: center;
            color: var(--primary);
            font-size: 18px;
            margin-top: 60px;
            font-family: monospace;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 20px;
            border-top: 1px solid #222;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header">
            <a href="index.html" class="btn-nav">← חזרה ללוטו 37</a>
        </div>

        <img src="wolf-logo.png" alt="לוגו הזאב הבודד 777" class="main-logo" onerror="this.style.display='none'">
        
        <div id="loading-msg">מתחבר למאגר Data_777... מבצע ניתוח סטטיסטי...</div>

        <div id="dashboard"></div>

        <div id="controls" class="controls-wrapper">
            <button id="generate-btn" class="btn-refresh" py-click="generate_and_display">רענן מספרי 777</button>
            
            <div class="select-group">
                <label>כמות בתים:</label>
                <select id="house-count">
                    <option value="5">5 בתים</option>
                    <option value="10" selected>10 בתים</option>
                    <option value="15">15 בתים</option>
                    <option value="20">20 בתים</option>
                </select>
            </div>
        </div>

        <div id="output"></div>

        <div class="footer">
            © 2026 מנוע הזאב הבודד - מהדורת 777 PRO<br>
            כל הזכויות שמורות לשמעון (שימי). ט.ל.ח.
        </div>
    </div>

    <py-config>
        packages = ["pandas"]
    </py-config>

    <script type="py">
        import pandas as pd
        import random
        from pyodide.http import open_url
        import js

        # קישור מעודכן עם ה-GID הנכון של חוצץ ה-777 שלך
        sheet_url = "https://docs.google.com/spreadsheets/d/1XDrGrOuNIQCLodDkIIGEykF1JlGAU4mmv2m12cMMSNw/export?format=csv&gid=125193362"
        
        try:
            df = pd.read_csv(open_url(sheet_url))
            # שאיבת 17 המספרים מעמודות C עד S (אינדקסים 2 עד 19)
            nums_df = df.iloc[:, 2:19]
            all_nums = nums_df.values.flatten()
            all_nums = [n for n in all_nums if not pd.isna(n)]
            
            counts = pd.Series(all_nums).value_counts()
            cold_pool = counts.sort_values(ascending=True).head(28).index.tolist()
            hot_pool = counts.sort_values(ascending=False).head(28).index.tolist()
            
            dash = js.document.getElementById("dashboard")
            dash.style.display = "block"
            
            cold_str = "  ".join([f"{int(x):02d}" for x in sorted(cold_pool[:7])])
            hot_str = "  ".join([f"{int(x):02d}" for x in sorted(hot_pool[:7])])
            
            dash.innerHTML = f"""
                נסרקו <b>{len(df)}</b> הגרלות 777 מהמאגר.<br><br>
                * מספרים קרים (פוטנציאל לשינוי):<br>
                <b>{cold_str}</b><br><br>
                * מספרים חמים (מגמת המכונה):<br>
                <b class="hot-nums">{hot_str}</b>
            """

        except Exception as e:
            js.console.log(f"Error loading: {str(e)}")
            cold_pool = list(range(1, 71))
            hot_pool = list(range(1, 71))

        js.document.getElementById("loading-msg").style.display = "none"
        js.document.getElementById("controls").style.display = "flex"

        def get_human_ticket():
            # אסטרטגיה המבוססת על פיזור רחב ומספרים קרים
            pool = cold_pool if len(cold_pool) >= 7 else list(range(1, 71))
            ticket = random.sample(pool, 7)
            ticket.sort()
            return [int(x) for x in ticket], "התנהגות בני אדם 🧠"

        def get_machine_ticket():
            # אסטרטגיה המבוססת על מגמות המכונה (מספרים חמים)
            pool = hot_pool if len(hot_pool) >= 7 else list(range(1, 71))
            ticket = random.sample(pool, 7)
            ticket.sort()
            return [int(x) for x in ticket], "התנהגות המכונה ⚙️"

        def generate_and_display(event=None):
            num_houses = int(js.document.getElementById("house-count").value)
            output_div = js.document.getElementById("output")
            output_div.innerHTML = ""
            html = ""
            
            for i in range(num_houses):
                # ערבוב בין השיטות
                t, name = get_human_ticket() if i % 2 == 0 else get_machine_ticket()
                circle_class = "circle-human" if "אדם" in name else "circle-machine"
                nums_html = "".join([f'<div class="num-circle {circle_class}">{int(num):02d}</div>' for num in t])
                
                html += f'''
                <div class="house-wrapper">
                    <div class="house-title">{name} | בית-{i+1:02d}</div>
                    <div class="house-box">{nums_html}</div>
                </div>
                '''
            output_div.innerHTML = html
    </script>
</body>
</html>
