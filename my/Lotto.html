<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע הזאב הבודד PRO</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    <style>
        :root {
            --primary: #00e676;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #aaaaaa;
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 { 
            color: var(--primary); 
            text-align: center;
            font-size: 28px; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 14px;
        }
        #dashboard { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border-right: 4px solid var(--primary);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            font-size: 16px;
            line-height: 1.6;
        }
        .tickets-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            min-height: 200px;
        }
        .ticket-row {
            background: #222;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .ticket-numbers {
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
        }
        .ticket-strong {
            background: var(--primary);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-magic {
            background: linear-gradient(45deg, #00e676, #00b8d4);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
        }
        .btn-magic:active {
            transform: scale(0.98);
        }
        .loading-text {
            color: #ffeb3b;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>הזאב הבודד PRO</h1>
        <p class="subtitle">מערכת חכמה לניתוח והפקת טפסי לוטו</p>
        
        <div id="dashboard" class="loading-text">
            מפעיל מנוע סטטיסטי ומתחבר למאגר הנתונים...<br>
            <small>(טעינה ראשונית עשויה לקחת כ-15 שניות)</small>
        </div>
        
        <div class="tickets-container">
            <div id="output"></div>
            <button id="generate-btn" class="btn-magic" py-click="generate_and_display">✨ הפק טפסים מחדש ✨</button>
        </div>
    </div>

    <py-config>
        packages = ["pandas"]
    </py-config>

    <script type="py">
        import pandas as pd
        import random
        from pyodide.http import open_url
        import js

        sheet_url = "https://docs.google.com/spreadsheets/d/1XDrGrOuNIQCLodDkIIGEykF1JlGAU4mmv2m12cMMSNw/export?format=csv"
        
        dashboard_div = js.document.getElementById("dashboard")
        output_div = js.document.getElementById("output")
        generate_btn = js.document.getElementById("generate-btn")

        smart_pool = list(range(1, 38))

        try:
            df = pd.read_csv(open_url(sheet_url))
            nums_df = df.iloc[:, 2:8]
            all_nums = nums_df.values.flatten()
            all_nums = [n for n in all_nums if not pd.isna(n)]
            
            counts = pd.Series(all_nums).value_counts().sort_values()
            smart_pool = counts.head(20).index.tolist()
            cold_display = [int(x) for x in counts.head(5).index.tolist()]
            
            dashboard_div.className = ""
            dashboard_div.innerHTML = f"✅ <b>סריקה הושלמה בהצלחה!</b><br><br>📊 נסרקו <b>{len(df)}</b> הגרלות ממאגר הנתונים.<br>🥶 המספרים הקרים למעקב: <b>{cold_display}</b>"
            generate_btn.style.display = "block"
            
        except Exception as e:
            dashboard_div.className = ""
            dashboard_div.style.color = "#ff5722"
            dashboard_div.innerHTML = f"⚠️ שגיאה בשאיבת הנתונים. המערכת עברה למצב גיבוי אקראי.<br><small>{str(e)}</small>"
            generate_btn.style.display = "block"

        def is_too_human(ticket):
            consecutive = 0
            for i in range(len(ticket)-1):
                if ticket[i+1] == ticket[i] + 1:
                    consecutive += 1
                    if consecutive >= 2:
                        return True
                else:
                    consecutive = 0
            return False

        def get_alpha_ticket():
            while True:
                ticket = []
                high_nums = [n for n in smart_pool if n >= 32]
                low_nums = [n for n in smart_pool if n < 32]
                
                ticket += random.sample(high_nums, min(len(high_nums), 3))
                rem = 6 - len(ticket)
                
                if len(low_nums) >= rem:
                    ticket += random.sample(low_nums, rem)
                else:
                    ticket += random.sample(list(range(1, 32)), rem)
                    
                ticket.sort()
                ticket = [int(x) for x in ticket]
                
                if not is_too_human(ticket):
                    strong = random.choice([1, 2, 3, 4, 5, 6])
                    return ticket, strong

        def generate_and_display(event=None):
            output_div.innerHTML = ""
            html_content = ""
            for i in range(5):
                t, s = get_alpha_ticket()
                t_str = "  ".join([f"{num:02d}" for num in t])
                html_content += f'''
                <div class="ticket-row">
                    <div class="ticket-numbers">טופס {i+1}: &nbsp;&nbsp;<b>{t_str}</b></div>
                    <div class="ticket-strong">חזק: {s}</div>
                </div>
                '''
            output_div.innerHTML = html_content

        generate_and_display()
    </script>
</body>
</html>
