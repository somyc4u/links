<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע הזאב הבודד PRO</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    <style>
        body { 
            background-color: #121212; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            font-size: 16px; 
            text-align: right;
        }
        h1 { color: #ffffff; border-bottom: 2px solid #00ff00; padding-bottom: 10px; font-size: 24px; }
        #dashboard { background: #1e1e1e; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px dashed #00ff00;}
        #output { white-space: pre-wrap; background: #000; padding: 15px; border-radius: 5px; line-height: 1.5;}
        .loading { color: #ffeb3b; }
    </style>
</head>
<body>
    <h1>🐺 הזאב הבודד PRO - לוח בקרה 🐺</h1>
    <div id="dashboard" class="loading">מפעילה מנוע סטטיסטי ומתחברת לשרתי הנתונים... (אנא המתן כ-15 שניות) ⚡️</div>
    <div id="output"></div>

    <py-config>
        packages = ["pandas"]
    </py-config>

    <script type="py">
        import pandas as pd
        import random
        from pyodide.http import open_url
        import js

        # הקישור הישיר לגוגל שיטס של שימי (בפורמט שאיבה נקי)
        sheet_url = "https://docs.google.com/spreadsheets/d/1XDrGrOuNIQCLodDkIIGEykF1JlGAU4mmv2m12cMMSNw/export?format=csv"
        
        dashboard_div = js.document.getElementById("dashboard")
        output_div = js.document.getElementById("output")

        try:
            # שאיבת הנתונים בזמן אמת מהגוגל שיטס!
            df = pd.read_csv(open_url(sheet_url))
            
            # לוקחים את העמודות של ששת המספרים (בהנחה שהם בעמודות C עד H, כלומר אינדקס 2 עד 7)
            nums_df = df.iloc[:, 2:8]
            all_nums = nums_df.values.flatten()
            
            # ניקוי תאים ריקים (במקרה של שורות אקסל ריקות)
            all_nums = [n for n in all_nums if not pd.isna(n)]
            
            # ניתוח "המספרים הקרים"
            counts = pd.Series(all_nums).value_counts().sort_values()
            smart_pool = counts.head(20).index.tolist()
            
            # מציגים בדשבורד את 5 הקרים ביותר
            cold_display = [int(x) for x in counts.head(5).index.tolist()]
            
            dashboard_div.className = ""
            dashboard_div.style.color = "#00ff00"
            dashboard_div.innerHTML = f"✅ סריקה ואנליזה הושלמו!<br><br>📊 נסרקו <b>{len(df)}</b> הגרלות היסטוריות מהמאגר.<br>🥶 5 המספרים הקרים ביותר למעקב: <b>{cold_display}</b>"
            
        except Exception as e:
            dashboard_div.className = ""
            dashboard_div.style.color = "#ff5722"
            dashboard_div.innerHTML = f"⚠️ שגיאה בשאיבת הנתונים. מפעילה מנוע גיבוי אקראי.<br>שגיאה: {str(e)}"
            smart_pool = list(range(1, 38))

        # פילטר אנטי-אנושי לטפסים (מונע רצפים כמו 12, 13, 14)
        def is_too_human(ticket):
            consecutive = 0
            for i in range(len(ticket)-1):
                if ticket[i+1] == ticket[i] + 1:
                    consecutive += 1
                    if consecutive >= 2:
                        return True
                else:
                    consecutive = 0
            return False

        def generate_alpha_ticket():
            while True:
                ticket = []
                high_nums = [n for n in smart_pool if n >= 32]
                low_nums = [n for n in smart_pool if n < 32]
                
                # מושכים מהמספרים הקרים - דגש על מספרים מעל 31
                ticket += random.sample(high_nums, min(len(high_nums), 3))
                rem = 6 - len(ticket)
                
                if len(low_nums) >= rem:
                    ticket += random.sample(low_nums, rem)
                else:
                    ticket += random.sample(list(range(1, 32)), rem)
                    
                ticket.sort()
                ticket = [int(x) for x in ticket] # דואגת שלא יהיו נקודות עשרוניות
                
                if not is_too_human(ticket):
                    strong = random.choice([1, 2, 3, 4, 5, 6])
                    return ticket, strong

        output_text = "🎯 הטפסים המומלצים להגרלה הקרובה:\n\n"
        for i in range(5):
            t, s = generate_alpha_ticket()
            output_text += f"טופס {i+1}: {t}  |  חזק: {s}\n"
            
        output_div.innerHTML = output_text
    </script>
</body>
</html>
