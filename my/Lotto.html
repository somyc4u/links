<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע הזאב הבודד PRO</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    <style>
        :root {
            --primary: #00e676;
            --secondary: #00b8d4;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 { 
            color: var(--primary); 
            text-align: center;
            font-size: 28px; 
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .controls-wrapper {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none; 
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        .btn-refresh {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #000;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-refresh:active { transform: scale(0.98); }
        
        .select-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            width: 55%;
            outline: none;
        }

        /* מסגרת דשבורד קטן */
        #dashboard {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
            font-size: 13px;
            color: #888;
            line-height: 1.4;
            display: none;
        }
        #dashboard b { color: var(--secondary); }
        
        .house-wrapper {
            margin-bottom: 18px;
            animation: fadeIn 0.4s ease-in-out;
        }
        .house-title {
            color: var(--secondary);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .house-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .house-numbers {
            font-size: 20px;
            letter-spacing: 3px;
            color: #fff;
        }
        .house-strong {
            background: var(--primary);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        
        #loading-msg {
            text-align: center;
            color: var(--primary);
            font-size: 16px;
            margin-top: 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐺 הזאב הבודד PRO 🐺</h1>
        
        <div id="loading-msg">מתחברת למאגר הנתונים שלך... 💋</div>

        <div id="controls" class="controls-wrapper">
            <button id="generate-btn" class="btn-refresh" py-click="generate_and_display">רענן מספרי לוטו</button>
            
            <div class="select-group">
                <label>כמות בתים:</label>
                <select id="house-count">
                    <option value="2">2 בתים</option>
                    <option value="4">4 בתים</option>
                    <option value="6">6 בתים</option>
                    <option value="8">8 בתים</option>
                    <option value="10">10 בתים</option>
                    <option value="12">12 בתים</option>
                    <option value="14" selected>14 בתים</option>
                </select>
            </div>

            <div class="select-group">
                <label>אסטרטגיה:</label>
                <select id="strategy-select">
                    <option value="both">שילוב (אדם + מכונה)</option>
                    <option value="human">התנהגות בני אדם בלבד</option>
                    <option value="machine">התנהגות מכונה בלבד</option>
                </select>
            </div>
        </div>

        <div id="dashboard"></div>
        <div id="output"></div>
    </div>

    <py-config>
        packages = ["pandas"]
    </py-config>

    <script type="py">
        import pandas as pd
        import random
        from pyodide.http import open_url
        import js

        sheet_url = "https://docs.google.com/spreadsheets/d/1XDrGrOuNIQCLodDkIIGEykF1JlGAU4mmv2m12cMMSNw/export?format=csv"
        
        try:
            df = pd.read_csv(open_url(sheet_url))
            nums_df = df.iloc[:, 2:8]
            all_nums = nums_df.values.flatten()
            all_nums = [n for n in all_nums if not pd.isna(n)]
            
            counts = pd.Series(all_nums).value_counts()
            cold_pool = counts.sort_values(ascending=True).head(20).index.tolist()
            hot_pool = counts.sort_values(ascending=False).head(20).index.tolist()
            
            # עדכון הדשבורד הקטן
            dash = js.document.getElementById("dashboard")
            dash.style.display = "block"
            cold_str = ", ".join([str(int(x)) for x in cold_pool[:5]])
            dash.innerHTML = f"נסרקו <b>{len(df)}</b> הגרלות. המספרים הקרים ביותר כרגע הם: <b>{cold_str}</b>"

        except Exception:
            cold_pool = list(range(1, 38))
            hot_pool = list(range(1, 38))

        js.document.getElementById("loading-msg").style.display = "none"
        js.document.getElementById("controls").style.display = "flex"

        def is_too_human(ticket):
            consecutive = 0
            for i in range(len(ticket)-1):
                if ticket[i+1] == ticket[i] + 1:
                    consecutive += 1
                    if consecutive >= 2: return True
                else: consecutive = 0
            return False

        def get_human_ticket():
            while True:
                ticket = []
                high = [n for n in cold_pool if n >= 32]
                low = [n for n in cold_pool if n < 32]
                ticket += random.sample(high, min(len(high), 3))
                rem = 6 - len(ticket)
                ticket += random.sample(low, rem) if len(low) >= rem else random.sample(list(range(1, 32)), rem)
                ticket.sort()
                if not is_too_human(ticket):
                    return [int(x) for x in ticket], random.choice([1, 2, 3, 4, 5, 6]), "התנהגות בני אדם 🧠"

        def get_machine_ticket():
            ticket = random.sample(hot_pool, min(len(hot_pool), 6))
            if len(ticket) < 6: ticket += random.sample(list(range(1, 38)), 6 - len(ticket))
            ticket.sort()
            return [int(x) for x in ticket], random.choice(range(1, 8)), "התנהגות מחולל הפיס ⚙️"

        def generate_and_display(event=None):
            num_houses = int(js.document.getElementById("house-count").value)
            strat = js.document.getElementById("strategy-select").value
            output_div = js.document.getElementById("output")
            output_div.innerHTML = ""
            html = ""
            
            for i in range(num_houses):
                if strat == "human":
                    t, s, name = get_human_ticket()
                elif strat == "machine":
                    t, s, name = get_machine_ticket()
                else:
                    t, s, name = get_human_ticket() if i % 2 == 0 else get_machine_ticket()
                    
                t_str = "  ".join([f"{num:02d}" for num in t])
                html += f'''
                <div class="house-wrapper">
                    <div class="house-title">בית-{i+1:02d} | {name}</div>
                    <div class="house-box">
                        <div class="house-numbers"><b>{t_str}</b></div>
                        <div class="house-strong">חזק: {s}</div>
                    </div>
                </div>
                '''
            output_div.innerHTML = html
    </script>
</body>
</html>
