<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע הזאב הבודד PRO - תורת המספרים</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    <style>
        :root {
            --primary: #00e676;
            --secondary: #00b8d4;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --alert: #ffb300; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 10px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        .main-logo {
            width: 100%; 
            max-width: 500px; 
            display: block; 
            margin: 0 auto 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .nav-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .btn-nav {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            font-weight: 900;
            font-size: 20px;
            border: 1px solid #444;
            transition: background 0.3s;
        }
        .nav-lotto { 
            background: var(--primary); 
            color: #000; 
            border: 2px solid #fff;
        }
        .nav-777 { background: #333; }

        #dashboard {
            background: #111;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #333;
            font-size: 15px;
            color: #ddd;
            line-height: 1.6;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #dashboard b { color: var(--secondary); font-size: 16px;}
        
        .controls-wrapper {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none; 
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        .btn-refresh {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #000;
            border: 3px solid #ffffff;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }
        .btn-refresh:active { transform: scale(0.98); }
        
        .select-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        select {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 55%;
            outline: none;
        }
        
        .house-wrapper {
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease-in-out;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 1px solid #444;
        }
        .house-title {
            font-weight: bold;
            font-size: 14px;
            padding: 8px 15px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .house-box {
            padding: 15px 5px; 
            display: flex;
            justify-content: center; 
            align-items: center;
            gap: 5px; 
            background-color: var(--card-bg); 
            flex-wrap: wrap; 
        }
        
        .house-numbers {
            display: flex;
            gap: 5px; 
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
        }
        
        .num-circle {
            width: 36px; 
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px; 
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6), inset 0 0 5px rgba(255,255,255,0.3);
            border: 2px solid #ffffff; 
            flex-shrink: 0; 
            margin: 2px;
        }

        .circle-human { background-color: #6a1b9a; }
        .circle-machine { background-color: #d32f2f; }
        
        .house-strong-circle {
            background-color: #00e5ff; 
            color: #000000; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 20px; 
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6), inset 0 0 5px rgba(255,255,255,0.5); 
            flex-shrink: 0; 
            border: 2px solid #ffffff; 
            margin-right: 6px; 
            margin-top: 2px;
        }
        
        .footer-container {
            margin-top: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            display: none;
        }
        .disclaimer-box {
            border: 1px solid #555;
            background: #151515;
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            color: #888;
            text-align: justify;
            line-height: 1.4;
        }
        .copyright {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        #loading-msg {
            text-align: center;
            color: var(--primary);
            font-size: 16px;
            margin-top: 50px;
            font-family: monospace;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="wolf-logo.png" alt="לוגו הזאב הבודד" class="main-logo" onerror="this.style.display='none'">
        
        <div class="nav-wrapper">
